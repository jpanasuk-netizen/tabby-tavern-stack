# Local runtime copy. Replace placeholders before `docker compose up`.
# Public tree ships placeholders only — never commit real keys.

network:
  host: 0.0.0.0
  port: 5000
  disable_auth: false

security:
  admin_key: "REPLACE_WITH_LONG_RANDOM_ADMIN_KEY"
  api_key: "REPLACE_WITH_LONG_RANDOM_API_KEY"

developer:
  disable_auth: false

model:
  model_dir: models
  model_name: Llama-3.1-8B-Instruct-exl3-6.0bpw
  max_seq_len: 8192
  cache_size: 8192
  cache_8bit: true
  rope_scale: 1.0
  prompt_template: from_tokenizer_config
